name: Temporary lockfile generation

on:
  push:
    branches: [ci/pr-verify-npm]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve missing declared SDK
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund '@google/genai@^1.29.0'
      - name: Emit generated manifests for authenticated recovery
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const [label, file] of [['PACKAGE', 'package.json'], ['LOCK', 'package-lock.json']]) {
            const encoded = Buffer.from(fs.readFileSync(file)).toString('base64');
            console.log('BEGIN_' + label);
            for (let i = 0; i < encoded.length; i += 900) {
              console.log('CHUNK_' + label + ':' + (i / 900) + ':' + encoded.slice(i, i + 900));
            }
            console.log('END_' + label);
          }
          NODE
