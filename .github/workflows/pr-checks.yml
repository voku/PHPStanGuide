name: PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify package-lock root metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const root = JSON.parse(fs.readFileSync('package-lock.json', 'utf8')).packages?.[''];
          if (!root) throw new Error('Missing package-lock root metadata');
          for (const group of ['dependencies', 'devDependencies']) {
            const declared = manifest[group] || {};
            const locked = root[group] || {};
            for (const key of new Set([...Object.keys(declared), ...Object.keys(locked)])) {
              if (declared[key] !== locked[key]) {
                console.error(group + '.' + key + ': declared=' + declared[key] + ' locked=' + locked[key]);
                process.exitCode = 1;
              }
            }
          }
          NODE
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Static checks
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Verify output
        run: test -f dist/index.html
